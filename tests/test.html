<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halloween Contest - Tests</title>
<style>
  body { background: #0d0a14; color: #f5efe6; font-family: "Segoe UI", system-ui, sans-serif; padding: 24px; }
  h1 { color: #ff7a1a; font-weight: 400; }
  .pass { color: #86efac; }
  .fail { color: #fca5a5; }
  li { margin: 6px 0; font-family: monospace; }
  #summary { font-size: 20px; margin: 16px 0; }
</style>
</head>
<body>
<h1>Halloween Contest — test results</h1>
<p id="summary">Running…</p>
<ol id="results"></ol>
<script src="../js/questions.js"></script>
<script src="../js/game-logic.js"></script>
<script src="../js/results-api.js"></script>
<script src="test-suite.js"></script>
<script>
  (function () {
    var list = document.getElementById("results");
    var failed = 0;
    var summary = document.getElementById("summary");

    function done() {
      summary.textContent = (TestSuite.tests.length - failed) + " passed, " + failed + " failed";
      summary.className = failed ? "fail" : "pass";
      document.title = "tests: " + summary.textContent;
    }

    // Tests run in order and may return a promise, so each result is rendered
    // only once it settles. Reporting before that would hide rejections.
    function runOne(t) {
      return Promise.resolve().then(function () { return t.fn(); }).then(function () {
        var li = document.createElement("li");
        li.className = "pass";
        li.textContent = "PASS  " + t.name;
        list.appendChild(li);
      }, function (e) {
        failed++;
        var li = document.createElement("li");
        li.className = "fail";
        li.textContent = "FAIL  " + t.name + " — " + (e && e.message ? e.message : e);
        list.appendChild(li);
      });
    }

    TestSuite.tests.reduce(function (chain, t) {
      return chain.then(function () { return runOne(t); });
    }, Promise.resolve()).then(done);
  })();
</script>
</body>
</html>
