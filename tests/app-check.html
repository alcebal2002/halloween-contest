<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halloween Contest — app checklist</title>
<style>
  body { background: #0d0a14; color: #f5efe6; font-family: monospace; padding: 20px; }
  .pass { color: #86efac; }
  .fail { color: #fca5a5; }
  pre { white-space: pre-wrap; }
  iframe { width: 640px; height: 700px; border: 1px solid #7c3aed; }
</style>
</head>
<body>
<h1>App checklist (bonus round edition)</h1>
<p id="verdict">running…</p>
<pre id="report"></pre>
<iframe id="f" src="../index.html" title="Halloween Contest under test"></iframe>

<script>
(function () {
  var KEY = "halloweenContest.state.v2";
  var f = document.getElementById("f");
  var results = [];

  function rec(name, ok, detail) { results.push({ name: name, ok: !!ok, detail: String(detail) }); }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function W() { return f.contentWindow; }
  function D() { return f.contentDocument; }
  function $(id) { return D().getElementById(id); }
  function app() { return W().HalloweenApp; }
  function screenOn() {
    var on = [];
    ["screen-nickname", "screen-instructions", "screen-welcome-back", "screen-question", "screen-feedback",
     "screen-bonus", "screen-results", "screen-error"].forEach(function (id) {
      if (!$(id).hidden) on.push(id);
    });
    return on.join("+") || "none";
  }
  // The harness must never reach the real Supabase project: every save is
  // answered from here. Set saveStub.mode to drive a different outcome; "slow"
  // holds the response open for saveStub.delayMs so a step can act while a
  // request is still in flight.
  var saveStub = { mode: "success", calls: [], delayMs: 1000 };
  function installSaveStub() {
    saveStub.calls = [];
    W().fetch = function (url, opts) {
      saveStub.calls.push({ url: String(url), opts: opts });
      if (saveStub.mode === "duplicate") {
        return Promise.resolve({
          ok: false, status: 409,
          json: function () {
            return Promise.resolve({
              code: "23505",
              message: "duplicate key value violates unique constraint \"contest_results_pkey\"",
              details: null, hint: null
            });
          }
        });
      }
      if (saveStub.mode === "network") return Promise.reject(new TypeError("Failed to fetch"));
      var ok = Promise.resolve({ ok: true, status: 201, json: function () { return Promise.resolve({}); } });
      if (saveStub.mode === "slow") {
        return new Promise(function (resolve) { setTimeout(function () { resolve(ok); }, saveStub.delayMs); });
      }
      return ok;
    };
  }

  function reload() {
    return new Promise(function (resolve) {
      f.onload = function () { installSaveStub(); setTimeout(resolve, 150); };
      f.src = "../index.html?cb=" + Date.now();
    });
  }
  function type(text) { $("nickname").value = text; }
  function click(el) { el.dispatchEvent(new (W().MouseEvent)("click", { bubbles: true })); }
  function pressEnter() {
    $("nickname").dispatchEvent(new (W().KeyboardEvent)("keydown", { key: "Enter", bubbles: true, cancelable: true }));
  }
  function options() { return $("question-options").querySelectorAll(".option"); }
  function bottles() { return $("bonus-bottles").querySelectorAll(".bottle"); }
  function hud() { return $("hud-points").textContent + " - " + $("hud-question").textContent; }
  // A full order that can never equal the hidden target (rotate it by one).
  function missOrder() {
    var t = app().getState().bonus.target;
    return t.slice(1).concat(t[0]);
  }
  function pick(order) {
    // Orders clear after every check, so the slots are empty when one starts.
    order.forEach(function (i) { click(bottles()[i]); });
    click($("btn-bonus-check"));
  }

  function step(name, fn) {
    try { fn(); } catch (e) { rec(name, false, "threw: " + e.message); }
  }

  async function astep(name, fn) {
    try { await fn(); } catch (e) { rec(name, false, "threw: " + e.message); }
  }

  function answerWrong() {
    var st = app().getState();
    var q = app().getQuestions()[st.questionIndex];
    var wrong = (q.correctIndex + 1) % 3;
    click(options()[wrong]);
    if (app().getView() === "feedback") click($("btn-next"));
  }

  // A reload of a resumable state lands on the welcome-back card, which has to
  // be continued before any screen it guards can be driven.
  function resumeIfOffered() {
    var cont = $("btn-continue");
    if (cont && !cont.hidden) click(cont);
  }

  async function run() {
    W().localStorage.clear();
    await reload();

    /* ---- 9. nickname validation ---- */
    step("9. empty and 21-character nicknames are rejected inline, state unchanged", function () {
      type("");
      click($("btn-start"));
      var emptyErr = !$("nickname-error").hidden && $("nickname-error").textContent.trim().length > 0;
      type("aaaaaaaaaaaaaaaaaaaaa");
      click($("btn-start"));
      var longErr = !$("nickname-error").hidden;
      var focusOk = ($("nickname").focus(), D().activeElement === $("nickname"));
      rec("9. empty and 21-character nicknames are rejected inline, state unchanged",
        emptyErr && longErr && focusOk && screenOn() === "screen-nickname" && !app().getState().sessionId &&
          $("hud").hidden,
        "emptyErr=" + emptyErr + " longErr=" + longErr + " refocus=" + focusOk + " screen=" + screenOn() +
          " hudHidden=" + $("hud").hidden);
    });

    /* ---- 7 (part) + start ---- */
    step("7. Enter in the nickname input opens the instructions screen", function () {
      type("Bat");
      pressEnter();
      var st = app().getState();
      rec("7. Enter in the nickname input opens the instructions screen",
        app().getView() === "instructions" && screenOn() === "screen-instructions" &&
          st.nickname === "Bat" && st.phase === "instructions" && st.questionIndex === 0,
        "view=" + app().getView() + " screen=" + screenOn() + " phase=" + st.phase);
    });

    step("7b. instructions explain the rules, the points table and start the play", function () {
      var rules = $("screen-instructions").querySelectorAll(".rules li");
      var text = $("screen-instructions").textContent;
      var explained = text.indexOf("10 Halloween questions") > -1 &&
        text.indexOf("+10 points") > -1 && text.indexOf("three attempts") > -1;
      var hudShown = !$("hud").hidden && hud() === "Total Points: 0 - Question 1/10";
      click($("btn-ready"));
      var started = app().getView() === "question" && app().getState().phase === "question";
      rec("7b. instructions explain the rules and 'I'm ready' starts question 1",
        rules.length >= 4 && explained && hudShown && started,
        "rules=" + rules.length + " explained=" + explained + " hud='" + hud() + "' view=" + app().getView());
    });

    step("3a. question screen shows 'Question 1 of 10' with exactly 3 options", function () {
      var progress = $("question-progress").textContent;
      var n = options().length;
      var focusable = true;
      Array.prototype.forEach.call(options(), function (b) {
        if (b.disabled || b.tabIndex < 0 || b.getAttribute("type") !== "button") focusable = false;
      });
      rec("3a. question screen shows 'Question 1 of 10' with exactly 3 focusable option buttons",
        progress === "Question 1 of 10" && n === 3 && focusable && hud() === "Total Points: 0 - Question 1/10",
        progress + " / options=" + n + " focusable=" + focusable + " hud='" + hud() + "'");
    });

    /* ---- immediate feedback ---- */
    step("immediate feedback: verdict, correct option marked, options locked, score 1", function () {
      var q = app().getQuestions()[0];
      click(options()[q.correctIndex]);
      var fBtns = $("feedback-options").querySelectorAll(".option");
      var allDisabled = Array.prototype.every.call(fBtns, function (b) { return b.disabled; });
      var marked = fBtns[q.correctIndex].className.indexOf("is-correct") > -1;
      var srHidden = $("feedback-verdict").classList.contains("sr-only");
      var st = app().getState();
      rec("immediate feedback: 'Correct!' only for screen readers, correct option marked, options locked, score 1",
        app().getView() === "feedback" && $("feedback-verdict").textContent === "Correct!" &&
          srHidden && allDisabled && marked && st.score === 1 && hud() === "Total Points: 1 - Question 1/10",
        "view=" + app().getView() + " verdict=" + $("feedback-verdict").textContent +
          " srOnly=" + srHidden + " disabled=" + allDisabled + " marked=" + marked +
          " score=" + st.score + " hud='" + hud() + "'");
    });

    /* ---- 1. resume during feedback ---- */
    await reload();
    step("1a. reload during feedback shows the welcome-back card with progress", function () {
      var name = $("welcome-back-name").textContent;
      var prog = $("welcome-back-progress").textContent;
      var noSummary = $("welcome-back-summary").hidden === true;
      rec("1a. reload during feedback shows the welcome-back card with progress",
        app().getView() === "welcomeBack" && name === "Welcome back, Bat" && prog === "Question 1 of 10" &&
          noSummary && $("hud").hidden,
        "view=" + app().getView() + " name=" + name + " progress=" + prog +
          " summaryHidden=" + noSummary + " hudHidden=" + $("hud").hidden);
    });

    step("1b. Continue restores the verdict and Next button, score unchanged", function () {
      click($("btn-continue"));
      var st = app().getState();
      rec("1b. Continue restores the verdict and Next button, score unchanged",
        app().getView() === "feedback" && $("feedback-verdict").textContent.length > 0 && st.score === 1,
        "view=" + app().getView() + " verdict=" + $("feedback-verdict").textContent + " score=" + st.score);
    });

    /* ---- bonus round: first attempt pays 5 ---- */
    step("2. Next on a correct answer opens the bonus round with three attempts", function () {
      click($("btn-next"));
      var st = app().getState();
      rec("2. Next on a correct answer opens the bonus round with three attempts",
        app().getView() === "bonus" && screenOn() === "screen-bonus" && st.phase === "bonus" &&
          st.bonus && st.bonus.attemptsUsed === 0 &&
          $("bonus-attempts").textContent.indexOf("Attempts left") === 0 &&
          $("btn-bonus-check").disabled === true &&
          $("btn-bonus-next").hidden === true &&
          hud() === "Total Points: 1 - Question 1/10",
        "view=" + app().getView() + " phase=" + st.phase + " attempts='" + $("bonus-attempts").textContent +
          "' checkDisabled=" + $("btn-bonus-check").disabled + " hud='" + hud() + "'");
    });

    step("2a. the tray shows four neon poison bottles in distinct colours", function () {
      var arts = $("bonus-bottles").querySelectorAll(".bottle-art");
      var labels = Array.prototype.map.call(arts, function (a) {
        return a.parentNode.querySelector(".bottle-label").textContent;
      });
      // Each bottle is drawn in its own neon colour from the shared vial, and its
      // label names that colour, so colour is never the only cue (spec §10.3).
      var colors = Array.prototype.map.call(arts, function (a) { return W().getComputedStyle(a).color; });
      var distinct = {}; colors.forEach(function (c) { distinct[c] = true; });
      var vials = Array.prototype.every.call(arts, function (a) {
        var use = a.querySelector("svg.vial > use");
        return !!use && (use.getAttribute("href") || use.getAttribute("xlink:href")) === "#vial";
      });
      rec("2a. the tray shows four neon poison bottles in distinct colours",
        arts.length === 4 && labels.join(",") === "Toxic green,Deep purple,Blood red,Cyanide cyan" &&
          Object.keys(distinct).length === 4 && vials,
        "labels=" + labels.join("/") + " colors=" + colors.join(" | "));
    });

    step("2a1. the order starts as four empty slot bottles", function () {
      var slots = $("bonus-slots").querySelectorAll(".slot");
      var empty = 0;
      Array.prototype.forEach.call(slots, function (s) {
        var g = s.querySelector(".slot-glyph");
        if (s.className.indexOf("is-filled") === -1 && g && g.querySelector("svg.vial > use")) empty++;
      });
      rec("2a1. the order starts as four empty slot bottles",
        slots.length === 4 && empty === 4,
        "slots=" + slots.length + " emptyBottles=" + empty);
    });

    step("2a2. the bottles are plain glossy glass, with no creature emoji or poison glyph", function () {
      var arts = $("bonus-bottles").querySelectorAll(".bottle-art");
      // spider, pumpkin, ghost, bat and the old poison glyphs
      var creature = /[\uD83D\uDD77\uD83C\uDF83\uD83D\uDC7B\uD83E\uDD87\u2620\u2697\u2623\u26B1]/;
      var ok = Array.prototype.every.call(arts, function (a) {
        return a.textContent === "" && !creature.test(a.textContent) && !a.hasAttribute("data-glyph");
      });
      rec("2a2. the bottles are plain glossy glass, with no creature emoji or poison glyph",
        arts.length === 4 && ok,
        "texts=" + Array.prototype.map.call(arts, function (a) { return "'" + a.textContent + "'"; }).join("/"));
    });

    step("2c. Check stays disabled until all four bottles are picked", function () {
      var target = app().getState().bonus.target;
      click(bottles()[target[0]]);
      click(bottles()[target[1]]);
      click(bottles()[target[2]]);
      var half = $("btn-bonus-check").disabled;
      var slotsFilled = $("bonus-slots").querySelectorAll(".slot.is-filled").length;
      click(bottles()[target[3]]);
      var full = $("btn-bonus-check").disabled;
      rec("2c. Check stays disabled until all four bottles are picked",
        half === true && slotsFilled === 3 && full === false && bottles()[target[3]].className.indexOf("is-picked") > -1,
        "afterThreeDisabled=" + half + " slots=" + slotsFilled + " afterFourDisabled=" + full);
    });

    step("2c2. each filled slot shows a bottle in its tray tile's colour", function () {
      var target = app().getState().bonus.target;
      var arts = $("bonus-bottles").querySelectorAll(".bottle-art");
      var slots = $("bonus-slots").querySelectorAll(".slot");
      var mismatched = 0, detail = "";
      for (var i = 0; i < slots.length; i++) {
        var tray = W().getComputedStyle(arts[target[i]]).color;
        var glyph = slots[i].querySelector(".slot-glyph");
        var inSlot = W().getComputedStyle(glyph).color;
        if (tray !== inSlot || !glyph.querySelector("svg.vial > use")) mismatched++;
        detail += (i + 1) + ":" + inSlot + " ";
      }
      rec("2c2. each filled slot shows a bottle in its tray tile's colour",
        slots.length === 4 && $("bonus-slots").querySelectorAll(".slot.is-filled").length === 4 &&
          mismatched === 0,
        "mismatched=" + mismatched + " slots=" + detail);
    });

    step("2c3. a filled slot lights its bottle in that bottle's neon colour", function () {
      var glyph = $("bonus-slots").querySelector(".slot.is-filled.slot-0 .slot-glyph");
      var green = "rgb(34, 197, 94)";
      var color = glyph ? W().getComputedStyle(glyph).color : "";
      // slot-0 is the toxic-green bottle, so its slot bottle carries that colour.
      rec("2c3. a filled slot lights its bottle in that bottle's neon colour",
        !!glyph && !!glyph.querySelector("svg.vial > use") && color === green,
        "color=" + color);
    });

    step("2d. matching the order on the first attempt pays an 11-point question", function () {
      click($("btn-bonus-check"));
      var st = app().getState();
      var verdict = $("bonus-verdict").textContent;
      rec("2d. matching the order on the first attempt pays an 11-point question",
        st.bonus.resolved === true && st.bonus.matched === true && st.bonus.attemptsUsed === 1 &&
          st.bonus.award === 10 && st.answers[0].points === 11 && st.score === 11 &&
          verdict.indexOf("Match on attempt 1") === 0 && verdict.indexOf("+10") > -1 &&
          $("btn-bonus-next").hidden === false && hud() === "Total Points: 11 - Question 1/10",
        "resolved=" + st.bonus.resolved + " attempts=" + st.bonus.attemptsUsed +
          " award=" + st.bonus.award + " points=" + st.answers[0].points + " score=" + st.score +
          " verdict='" + verdict + "' hud='" + hud() + "'");
    });

    step("2d1. the bonus award flashes +10 in the middle of the screen", function () {
      var flash = $("bonus-flash");
      var cs = W().getComputedStyle(flash);
      var size = parseFloat(W().getComputedStyle($("bonus-flash-text")).fontSize);
      var centred = cs.position === "fixed" && cs.display === "flex" &&
        cs.alignItems === "center" && cs.justifyContent === "center";
      // Bigger than the 16px verdict, centred over the whole viewport.
      rec("2d1. the bonus award flashes +10 in the middle of the screen",
        !flash.hidden && $("bonus-flash-text").textContent === "+10" && centred && size > 40,
        "hidden=" + flash.hidden + " text='" + $("bonus-flash-text").textContent +
          "' position=" + cs.position + " display=" + cs.display + " fontSize=" + size);
    });

    await wait(2200);
    step("2d1b. the award flash disappears after a couple of seconds", function () {
      rec("2d1b. the award flash disappears after a couple of seconds",
        $("bonus-flash").hidden === true && $("bonus-flash-text").textContent === "+10",
        "hidden=" + $("bonus-flash").hidden);
    });

    step("2d2. a match rings all four order slots in neon green (border only)", function () {
      var slots = $("bonus-slots").querySelectorAll(".slot");
      var matched = $("bonus-slots").querySelectorAll(".slot.is-matched");
      var glowing = 0, pulsing = 0, green = false, borderOnly = 0;
      Array.prototype.forEach.call(matched, function (s) {
        var cs = W().getComputedStyle(s);
        if (cs.boxShadow !== "none") glowing++;
        if (cs.animationName.indexOf("pulse") > -1) pulsing++;
        var rgb = cs.borderTopColor.match(/\d+/g);
        if (rgb && +rgb[1] > 180 && +rgb[0] < 120 && +rgb[2] < 120) green = true;
        // The bottle inside keeps its own colour and fill — only the border is neon.
        var glyphColor = W().getComputedStyle(s.querySelector(".slot-glyph")).color;
        if (glyphColor !== "rgb(57, 255, 20)" && cs.backgroundColor !== "rgba(57, 255, 20, 0.14)") borderOnly++;
      });
      var reduced = W().matchMedia("(prefers-reduced-motion: reduce)").matches;
      rec("2d2. a match rings all four order slots in neon green (border only)",
        slots.length === 4 && matched.length === 4 && glowing === 4 && green && borderOnly === 4 &&
          (reduced || pulsing === 4),
        "slots=" + slots.length + " matched=" + matched.length + " glowing=" + glowing +
          " pulsing=" + pulsing + " green=" + green + " borderOnly=" + borderOnly +
          " reducedMotion=" + reduced);
    });

    step("2e. the bonus Next button advances to question 2", function () {
      click($("btn-bonus-next"));
      rec("2e. the bonus Next button advances to question 2",
        app().getView() === "question" && app().getState().questionIndex === 1 &&
          $("question-progress").textContent === "Question 2 of 10" &&
          hud() === "Total Points: 11 - Question 2/10",
        "view=" + app().getView() + " progress=" + $("question-progress").textContent + " hud='" + hud() + "'");
    });

    await reload();
    step("2b. reload mid-question resumes at the same question after Continue", function () {
      var prog = $("welcome-back-progress").textContent;
      click($("btn-continue"));
      rec("2b. reload mid-question resumes at the same question after Continue",
        prog === "Question 2 of 10" && app().getView() === "question" && app().getState().questionIndex === 1,
        "card said " + prog + " → view=" + app().getView() + " index=" + app().getState().questionIndex);
    });

    /* ---- bonus round: three misses pay 1 ---- */
    step("f1. a second correct answer opens a fresh bonus round", function () {
      var st = app().getState();
      var q = app().getQuestions()[st.questionIndex];
      click(options()[q.correctIndex]);
      click($("btn-next"));
      var s2 = app().getState();
      rec("f1. a second correct answer opens a fresh bonus round",
        app().getView() === "bonus" && s2.bonus && s2.bonus.attemptsUsed === 0 && s2.bonus.resolved === false &&
          hud() === "Total Points: 12 - Question 2/10",
        "view=" + app().getView() + " attempts=" + (s2.bonus && s2.bonus.attemptsUsed) + " hud='" + hud() + "'");
    });

    step("f1b. the next round starts un-highlighted with the bottles selectable again", function () {
      var matched = $("bonus-slots").querySelectorAll(".slot.is-matched").length;
      var filled = $("bonus-slots").querySelectorAll(".slot.is-filled").length;
      var enabled = 0;
      Array.prototype.forEach.call(bottles(), function (b) { if (!b.disabled) enabled++; });
      rec("f1b. the next round starts un-highlighted with the bottles selectable again",
        matched === 0 && filled === 0 && enabled === 4 && $("btn-bonus-check").disabled === true,
        "matched=" + matched + " filled=" + filled + " clickableBottles=" + enabled +
          " checkDisabled=" + $("btn-bonus-check").disabled);
    });

    step("f2. a partial match blinks the right position green and freezes the round", function () {
      var t = app().getState().bonus.target;
      var order = [t[0], t[2], t[3], t[1]];   // position 1 is right, the rest are not
      pick(order);
      var st = app().getState();
      var slots = $("bonus-slots").querySelectorAll(".slot");
      var filled = $("bonus-slots").querySelectorAll(".slot.is-filled").length;
      var rings = $("bonus-slots").querySelectorAll(".slot.is-correct-pos").length;
      var matched = $("bonus-slots").querySelectorAll(".slot.is-matched").length;
      // The right position blinks neon green; the two wrong slots stay bare, and
      // every control is locked while the blink is on screen.
      var ring = $("bonus-slots").querySelector(".slot.is-correct-pos");
      var cs = ring ? W().getComputedStyle(ring) : null;
      var rgb = cs ? cs.borderTopColor.match(/\d+/g) : null;
      var reduced = W().matchMedia("(prefers-reduced-motion: reduce)").matches;
      var glowing = !!cs && !!rgb && +rgb[1] > 180 && +rgb[0] < 120 && +rgb[2] < 120 &&
        (reduced ? cs.animationName === "none" : cs.animationName.indexOf("blink") > -1);
      var wrongBare = slots[1] ? W().getComputedStyle(slots[1]).boxShadow === "none" : false;
      // The blink is on the border only — the bottle inside keeps its colour.
      var contentBare = !!ring &&
        W().getComputedStyle(ring.querySelector(".slot-glyph")).color !== "rgb(57, 255, 20)" &&
        cs.backgroundColor !== "rgba(57, 255, 20, 0.14)";
      var locked = Array.prototype.every.call(bottles(), function (b) { return b.disabled; });
      rec("f2. a partial match blinks the right position green and freezes the round",
        st.bonus.resolved === false && st.bonus.attemptsUsed === 1 && st.score === 12 &&
          st.bonus.tried.join(",") === order.join(",") &&
          $("bonus-verdict").textContent === "No match - try again." &&
          $("bonus-attempts").textContent.indexOf("2") > -1 &&
          filled === 4 && rings === 1 && matched === 0 && ring === slots[0] && glowing && wrongBare &&
          contentBare && locked &&
          $("btn-bonus-check").disabled === true && $("btn-bonus-reset").disabled === true,
        "resolved=" + st.bonus.resolved + " attempts=" + st.bonus.attemptsUsed + " score=" + st.score +
          " filled=" + filled + " rings=" + rings + " matched=" + matched + " ringIsFirst=" + (ring === slots[0]) +
          " glowing=" + glowing + " wrongBare=" + wrongBare + " contentBare=" + contentBare + " locked=" + locked +
          " checkDisabled=" + $("btn-bonus-check").disabled);
    });

    await wait(2400);
    step("f2c. after the blink the boxes are emptied for the next attempt", function () {
      var st = app().getState();
      var filled = $("bonus-slots").querySelectorAll(".slot.is-filled").length;
      var rings = $("bonus-slots").querySelectorAll(".slot.is-correct-pos").length;
      var ready = 0;
      Array.prototype.forEach.call(bottles(), function (b) { if (!b.disabled) ready++; });
      rec("f2c. after the blink the boxes are emptied for the next attempt",
        st.bonus.resolved === false && st.bonus.attemptsUsed === 1 && filled === 0 && rings === 0 &&
          ready === 4 && $("btn-bonus-check").disabled === true,
        "attempts=" + st.bonus.attemptsUsed + " filled=" + filled + " rings=" + rings +
          " clickableBottles=" + ready + " checkDisabled=" + $("btn-bonus-check").disabled);
    });

    await reload();
    step("f2b. reloading mid-round starts from empty boxes with the attempt still spent", function () {
      var card = $("welcome-back-progress").textContent;
      click($("btn-continue"));
      var st = app().getState();
      var filled = $("bonus-slots").querySelectorAll(".slot.is-filled").length;
      var picked = $("bonus-bottles").querySelectorAll(".bottle.is-picked").length;
      var ready = 0;
      Array.prototype.forEach.call(bottles(), function (b) { if (!b.disabled) ready++; });
      rec("f2b. reloading mid-round starts from empty boxes with the attempt still spent",
        card === "Question 2 of 10" && app().getView() === "bonus" && st.bonus.attemptsUsed === 1 &&
          st.bonus.resolved === false && filled === 0 && picked === 0 && ready === 4 &&
          $("btn-bonus-check").disabled === true,
        "card='" + card + "' view=" + app().getView() + " attempts=" + st.bonus.attemptsUsed +
          " filled=" + filled + " picked=" + picked + " clickableBottles=" + ready +
          " checkDisabled=" + $("btn-bonus-check").disabled);
    });

    step("f3. a miss with nothing right clears at once, and the third settles at 1 point", function () {
      pick(missOrder());
      var st = app().getState();
      var stillOpen = st.bonus.resolved === false;
      var verdictBefore = $("bonus-verdict").textContent;
      var clearedAtOnce = $("bonus-slots").querySelectorAll(".slot.is-filled").length === 0 &&
        $("bonus-slots").querySelectorAll(".slot.is-correct-pos").length === 0;
      if (stillOpen) pick(missOrder());
      var done = app().getState();
      rec("f3. a miss with nothing right clears at once, and the third settles at 1 point",
        stillOpen && clearedAtOnce && verdictBefore === "No match - try again." && done.bonus.resolved === true &&
          done.bonus.matched === false && done.bonus.attemptsUsed === 3 &&
          done.answers[1].points === 1 && done.score === 12 &&
          $("bonus-verdict").textContent.indexOf("You still keep 1 point") > -1,
        "stillOpen=" + stillOpen + " clearedAtOnce=" + clearedAtOnce + " verdictBefore='" + verdictBefore + "' attempts=" + done.bonus.attemptsUsed +
          " points=" + done.answers[1].points + " score=" + done.score +
          " verdict='" + $("bonus-verdict").textContent + "'");
    });

    step("f3b. three misses fill the slots with the order but never light them up", function () {
      var matched = $("bonus-slots").querySelectorAll(".slot.is-matched").length;
      var filled = $("bonus-slots").querySelectorAll(".slot.is-filled").length;
      var rings = $("bonus-slots").querySelectorAll(".slot.is-correct-pos").length;
      rec("f3b. three misses fill the slots with the order but never light them up",
        filled === 4 && matched === 0 && rings === 0 && app().getState().bonus.matched === false,
        "filled=" + filled + " matched=" + matched + " rings=" + rings);
    });

    step("f4. the bonus Next button carries on to question 3", function () {
      click($("btn-bonus-next"));
      rec("f4. the bonus Next button carries on to question 3",
        app().getView() === "question" && app().getState().questionIndex === 2 &&
          $("question-progress").textContent === "Question 3 of 10",
        "view=" + app().getView() + " progress=" + $("question-progress").textContent);
    });

    /* ---- 4. start over ---- */
    await reload();
    step("4. Start over regenerates sessionId and clears progress", function () {
      var before = app().getState().sessionId;
      click($("btn-start-over"));
      var st = app().getState();
      rec("4. Start over regenerates sessionId and clears progress",
        st.sessionId !== before && st.answers.length === 0 && st.score === 0 && st.questionIndex === 0 &&
          st.bonus === null && app().getView() === "question",
        "newSession=" + (st.sessionId !== before) + " answers=" + st.answers.length + " view=" + app().getView());
    });

    /* ---- 5. swapped data set ---- */
    step("5. stale questionOrder discards progress and explains on the nickname screen", function () {
      var raw = JSON.parse(W().localStorage.getItem(KEY));
      raw.questionOrder = [9999];
      W().localStorage.setItem(KEY, JSON.stringify(raw));
    });
    await reload();
    step("5. stale questionOrder discards progress, nickname pre-filled with an explanation", function () {
      var noteShown = !$("nickname-note").hidden;
      var preFilled = $("nickname").value;
      rec("5. stale questionOrder discards progress, nickname pre-filled with an explanation",
        app().getView() === "nickname" && noteShown && preFilled === "Bat" && $("hud").hidden,
        "view=" + app().getView() + " note=" + noteShown + " prefilled='" + preFilled + "'");
    });

    /* ---- 5b. corrupt JSON is ignored silently (spec §7 row 1) ---- */
    W().localStorage.setItem(KEY, "{not json at all");
    await reload();
    step("5b. corrupt JSON: silent fresh start, no misleading note, empty input", function () {
      var noteShown = !$("nickname-note").hidden;
      var preFilled = $("nickname").value;
      rec("5b. corrupt JSON: silent fresh start, no misleading note, empty input",
        app().getView() === "nickname" && !noteShown && preFilled === "",
        "view=" + app().getView() + " noteShown=" + noteShown + " prefilled='" + preFilled + "'");
    });

    /* ---- 5c. a stored welcomeBack phase must not make Continue a no-op ---- */
    W().localStorage.clear();
    await reload();
    step("5c. stored phase welcomeBack: Continue resumes the question", function () {
      type("Bat");
      pressEnter();
      click($("btn-ready"));
      var raw = JSON.parse(W().localStorage.getItem(KEY));
      raw.phase = "welcomeBack";
      W().localStorage.setItem(KEY, JSON.stringify(raw));
    });
    await reload();
    step("5c. stored phase welcomeBack: Continue resumes the question, not a loop", function () {
      var onCard = app().getView() === "welcomeBack";
      click($("btn-continue"));
      rec("5c. stored phase welcomeBack: Continue resumes the question, not a loop",
        onCard && app().getView() === "question" && app().getState().questionIndex === 0,
        "card=" + onCard + " view after Continue=" + app().getView());
    });

    /* ---- 8. zero-correct finish ---- */
    W().localStorage.clear();
    await reload();
    step("start a fresh run as 'Unlucky'", function () {
      type("Unlucky");
      pressEnter();
      click($("btn-ready"));
      rec("start a fresh run as 'Unlucky'", app().getView() === "question", "view=" + app().getView());
    });

    for (var i = 0; i < 10; i++) {
      answerWrong();
    }
    await wait(60);
    step("8. zero-correct finish shows 0 / 110, time, timestamp and 10 review rows", function () {
      var st = app().getState();
      var score = $("results-score").textContent;
      var time = $("results-time").textContent;
      var fin = $("results-finished").textContent;
      var rows = $("results-review").children.length;
      rec("8. zero-correct finish shows 0 / 110, a total time, a finish timestamp and 10 review rows",
        app().getView() === "results" && st.score === 0 && score === "0 / 110" &&
          time.indexOf("Total time: ") === 0 && fin.indexOf("Finished at") === 0 && rows === 10 &&
          hud() === "Total Points: 0 - Question 10/10",
        "view=" + app().getView() + " score='" + score + "' time='" + time + "' finished='" + fin +
          "' rows=" + rows + " hud='" + hud() + "'");
    });

    /* ---- 8b. resume on the results phase (spec §3: Continue returns to results) ---- */
    await reload();
    step("8b. reload after finishing: welcome-back says Finished, shows the time, Continue returns to results", function () {
      var prog = $("welcome-back-progress").textContent;
      var summaryShown = $("welcome-back-summary").hidden === false;
      var time = $("welcome-back-time").textContent;
      var fin = $("welcome-back-finished").textContent;
      click($("btn-continue"));
      rec("8b. reload after finishing: the card shows the final score with the elapsed and finish time",
        prog.indexOf("Finished - score 0 / 110") === 0 && summaryShown &&
          time.indexOf("Total time: ") === 0 && fin.indexOf("Finished at") === 0 &&
          app().getView() === "results" && $("results-score").textContent === "0 / 110",
        "card said '" + prog + "' summaryShown=" + summaryShown + " time='" + time + "' finished='" + fin +
          "' → view=" + app().getView() + " score=" + $("results-score").textContent);
    });

    /* ---- 3. play again ---- */
    step("3. Play again resets with a new sessionId and score 0", function () {
      var before = app().getState().sessionId;
      click($("btn-play-again"));
      var st = app().getState();
      rec("3. Play again resets with a new sessionId and score 0",
        st.sessionId !== before && st.score === 0 && st.questionIndex === 0 && st.answers.length === 0 &&
          app().getView() === "question",
        "newSession=" + (st.sessionId !== before) + " score=" + st.score + " view=" + app().getView());
    });

    /* ---- Supabase save ---- */

    await astep("s1. finishing saves the result and reports it on the results screen", async function () {
      saveStub.mode = "success";
      await reload();
      resumeIfOffered();
      for (var i = 0; i < 10 && app().getView() !== "results"; i++) answerWrong();
      // The transient state is set by the same render that finishes the run,
      // so it is visible here — before the stub's promise has resolved.
      var sawSaving = !$("results-save").hidden && $("results-save").textContent === "Saving your results…";
      await wait(120);
      var line = $("results-save");
      var retry = $("btn-results-retry");
      var call = saveStub.calls[0];
      rec("s1. finishing saves the result and reports it on the results screen",
        app().getView() === "results" &&
          sawSaving &&
          !line.hidden && line.textContent === "Results saved." &&
          retry.hidden &&
          saveStub.calls.length === 1 &&
          call.url.indexOf("/rest/v1/contest_results") !== -1 &&
          call.opts.headers["apikey"].indexOf("sb_") === 0,
        "sawSaving=" + sawSaving + " text='" + line.textContent + "' retryHidden=" + retry.hidden +
          " calls=" + saveStub.calls.length + " url=" + (call ? call.url : "none"));
    });

    await astep("s2. a duplicate submission reports it and offers no retry", async function () {
      saveStub.mode = "duplicate";
      await reload();
      resumeIfOffered();
      // Start a new run: the previous session id is already in the local
      // marker, so only a fresh one can exercise the server's duplicate rule.
      click($("btn-play-again"));
      for (var i = 0; i < 10 && app().getView() !== "results"; i++) answerWrong();
      await wait(120);
      var line = $("results-save");
      var retry = $("btn-results-retry");
      rec("s2. a duplicate submission reports it and offers no retry",
        !line.hidden &&
          line.textContent === "This session's results are already stored." &&
          retry.hidden &&
          saveStub.calls.length === 1,
        "text='" + line.textContent + "' retryHidden=" + retry.hidden + " calls=" + saveStub.calls.length);
    });

    await astep("s3. a network failure offers a retry that succeeds on the second attempt", async function () {
      saveStub.mode = "network";
      await reload();
      resumeIfOffered();
      // The resumed run may attempt its own save before this one starts, so the
      // count is measured from the moment the new run is armed.
      await wait(120);
      click($("btn-play-again"));
      var before = saveStub.calls.length;
      for (var i = 0; i < 10 && app().getView() !== "results"; i++) answerWrong();
      await wait(120);
      var line = $("results-save");
      var retry = $("btn-results-retry");
      var failedSeen = !line.hidden && line.textContent === "Couldn't save your results." && !retry.hidden;
      saveStub.mode = "success";
      click(retry);
      await wait(120);
      rec("s3. a network failure offers a retry that succeeds on the second attempt",
        failedSeen &&
          line.textContent === "Results saved." &&
          retry.hidden &&
          saveStub.calls.length === before + 2,
        "failedSeen=" + failedSeen + " text='" + line.textContent + "' calls=" + saveStub.calls.length +
          " before=" + before);
    });

    await astep("s4. reloading a finished run shows 'already saved' and sends nothing", async function () {
      saveStub.mode = "success";
      await reload();
      resumeIfOffered();
      await wait(120);
      click($("btn-play-again"));
      for (var i = 0; i < 10 && app().getView() !== "results"; i++) answerWrong();
      await wait(120);
      // Finishing writes the marker, so the reload that follows must stay quiet.
      var savedBeforeReload = saveStub.calls.length === 1 && $("results-save").textContent === "Results saved.";
      await reload();
      resumeIfOffered();
      await wait(150);
      var line = $("results-save");
      rec("s4. reloading a finished run shows 'already saved' and sends nothing",
        savedBeforeReload &&
          app().getView() === "results" &&
          !line.hidden && line.textContent === "Results already saved." &&
          saveStub.calls.length === 0,
        "savedBeforeReload=" + savedBeforeReload + " text='" + line.textContent +
          "' calls=" + saveStub.calls.length);
    });

    await astep("s5. Play again arms a fresh save for the new session id", async function () {
      saveStub.mode = "success";
      await reload();
      resumeIfOffered();
      await wait(120);
      var before = saveStub.calls.length;
      click($("btn-play-again"));
      await wait(80);
      for (var i = 0; i < 10 && app().getView() !== "results"; i++) answerWrong();
      await wait(120);
      var line = $("results-save");
      rec("s5. Play again arms a fresh save for the new session id",
        app().getView() === "results" &&
          line.textContent === "Results saved." &&
          saveStub.calls.length === before + 1,
        "text='" + line.textContent + "' calls=" + saveStub.calls.length + " before=" + before);
    });

    await astep("s6. a save still in flight when Play again is pressed cannot swallow the new run's save", async function () {
      saveStub.mode = "slow";
      saveStub.delayMs = 800;
      await reload();
      resumeIfOffered();
      await wait(150);
      var before = saveStub.calls.length;
      // Finish a run and press Play again while its response is still pending.
      click($("btn-play-again"));
      for (var i = 0; i < 10 && app().getView() !== "results"; i++) answerWrong();
      var pendingSession = app().getState().sessionId;
      // The status text is written by the render; the request itself is
      // dispatched a microtask later, so the counter is read after a tick.
      var wasPending = $("results-save").textContent === "Saving your results…";
      await wait(40);
      var postedFirst = saveStub.calls.length === before + 1;
      click($("btn-play-again"));
      var newSession = app().getState().sessionId;
      // Let the abandoned run's response land, then finish the new one.
      await wait(1000);
      saveStub.mode = "success";
      saveStub.delayMs = 0;
      for (var j = 0; j < 10 && app().getView() !== "results"; j++) answerWrong();
      await wait(150);
      var line = $("results-save");
      var posted = JSON.parse(saveStub.calls[saveStub.calls.length - 1].opts.body);
      rec("s6. a save still in flight when Play again is pressed cannot swallow the new run's save",
        wasPending &&
          postedFirst &&
          pendingSession !== newSession &&
          app().getView() === "results" &&
          line.textContent === "Results saved." &&
          posted.session_id === newSession &&
          saveStub.calls.length === before + 2,
        "wasPending=" + wasPending + " postedFirst=" + postedFirst + " text='" + line.textContent +
          "' calls=" + saveStub.calls.length + " before=" + before +
          " lastPosted=" + posted.session_id + " newSession=" + newSession);
      saveStub.mode = "success";
      saveStub.delayMs = 1000;
    });

    /* ---- report ---- */
    var failed = results.filter(function (r) { return !r.ok; });
    var verdict = document.getElementById("verdict");
    verdict.textContent = (results.length - failed.length) + " passed, " + failed.length + " failed";
    verdict.className = failed.length ? "fail" : "pass";
    document.getElementById("report").textContent = results.map(function (r) {
      return (r.ok ? "PASS  " : "FAIL  ") + r.name + "\n      [" + r.detail + "]";
    }).join("\n");
    document.title = "app checklist: " + verdict.textContent;
  }

  run().catch(function (e) {
    document.getElementById("verdict").textContent = "HARNESS ERROR " + e.message;
    document.getElementById("verdict").className = "fail";
  });
})();
</script>
</body>
</html>
