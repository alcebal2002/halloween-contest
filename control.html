<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GFT Halloween Contest Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
<div class="fog" aria-hidden="true"></div>

<main class="card">
  <header class="masthead">
    <h1 class="title">GFT Halloween Contest Control</h1>
    <p id="ctl-status" class="save-status" aria-live="polite">Loading&hellip;</p>
  </header>

  <section class="kpi-grid" aria-label="Contest statistics">
    <article id="kpi-nicknames" class="kpi kpi-magenta">
      <span class="kpi-icon" aria-hidden="true">🦇</span>
      <span class="kpi-label">Registered nicknames</span>
      <span class="kpi-value">&hellip;</span>
      <span class="kpi-sub"></span>
    </article>
    <article id="kpi-contests" class="kpi kpi-orange">
      <span class="kpi-icon" aria-hidden="true">🎃</span>
      <span class="kpi-label">Completed contests</span>
      <span class="kpi-value">&hellip;</span>
      <span class="kpi-sub"></span>
    </article>
    <article id="kpi-maxScore" class="kpi kpi-purple">
      <span class="kpi-icon" aria-hidden="true">🏆</span>
      <span class="kpi-label">Max score</span>
      <span class="kpi-value">&hellip;</span>
      <span class="kpi-sub"></span>
    </article>
    <article id="kpi-minTime" class="kpi kpi-green">
      <span class="kpi-icon" aria-hidden="true">⏱️</span>
      <span class="kpi-label">Min contest time</span>
      <span class="kpi-value">&hellip;</span>
      <span class="kpi-sub"></span>
    </article>
  </section>

  <div class="actions actions-stack">
    <button id="ctl-refresh" class="btn" type="button">Refresh</button>
    <a class="btn btn-ghost" href="stats.html">See the leaderboard</a>
    <a class="btn btn-ghost" href="index.html">Back to the questionnaire</a>
  </div>
</main>

<footer class="page-foot">Happy Halloween 🕸️</footer>

<script src="js/game-logic.js?v=2"></script>
<script src="js/supabase-config.js?v=2"></script>
<script src="js/results-api.js?v=2"></script>
<script src="js/control.js?v=2"></script>
<script>
  Control.boot(document, ResultsApi, window.SUPABASE_CONFIG);
</script>
</body>
</html>
